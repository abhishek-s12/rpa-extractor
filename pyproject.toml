[project]
name = "renpy-extractor"
version = "0.1.0"
description = "A professional-grade Ren'Py Asset Extraction Tool"
requires-python = ">=3.11"
dependencies = [
    "customtkinter",
    "rich",
    "typer",
    "click",
    "Pillow",
    "mutagen",
    "opencv-python",
    "tqdm",
    "orjson",
    "construct",
    "watchdog",
    "loguru",
    "pytest",
    "mypy"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
